name: build

# Publishes the tip of main as :devel, so the latest suite can be run without
# cutting a release. :latest stays with the newest v#.#.# tag, which is what
# an unqualified pull gets.
# Needs the same QUAY_USERNAME and QUAY_TOKEN secrets as the release workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: quay.io/waf/testsuite-waf-engine

jobs:
  # The same checks a pull request runs; nothing is published unless they pass.
  lint:
    uses: ./.github/workflows/lint.yml

  verify-image:
    uses: ./.github/workflows/image.yml

  push:
    needs: [lint, verify-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to full-length commit SHAs, as the org requires.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      # devel moves with main; the sha tag is immutable, so a run that broke
      # can be reproduced later.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=devel
            type=sha,prefix=main-,format=short

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
