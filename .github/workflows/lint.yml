name: lint

on:
  pull_request:
  # On main this runs as part of the build and release workflows, which gate
  # publishing an image on it passing.
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check out; defaults to the calling ref.
        type: string
        required: false

jobs:
  ruff:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to full-length commit SHAs, as the org requires.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      # Catches a broken fixture or a bad marker without needing a gateway.
      - name: Collect tests
        run: uv run pytest --collect-only -q --url http://gateway.invalid
